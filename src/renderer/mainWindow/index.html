<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./index.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSumize - Main</title>
  </head>
  <body>
    <div id="taskbar">
      <h1>WebSumize</h1>
      <div class="dropdownmenu">
        <svg
          id="lines"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 122.88 95.95"
        >
          <path
            fill="currentColor"
            d="M8.94 0h105c4.92 0 8.94 4.02 8.94 8.94s-4.02 8.94-8.94 8.94h-105C4.02 17.88 0 13.86 0 8.94S4.02 0 8.94 0zm0 78.07h105c4.92 0 8.94 4.02 8.94 8.94s-4.02 8.94-8.94 8.94h-105C4.02 95.95 0 91.93 0 87.01s4.02-8.94 8.94-8.94zm0-39.04h105c4.92 0 8.94 4.02 8.94 8.94s-4.02 8.94-8.94 8.94h-105C4.02 56.91 0 52.89 0 47.97s4.02-8.94 8.94-8.94z"
          />
        </svg>

        <div class="dropdownmenu-content">
          <button id="Settings" class="dropdownBtn">Settings</button>
          <button id="export" class="dropdownBtn">Export Data</button>
          <button id="import" class="dropdownBtn">Import Data</button>
          <button id="logoutBtn" class="dropdownBtn">Logout</button>
        </div>
      </div>
    </div>
    <span
      title="Refresh timetable (Ctrl + Shift + R)"
      class="material-symbols-outlined"
      id="refreshBtn"
    >
      refresh
    </span>
    <div id="timetable">
      <p id="timetabletext"></p>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
