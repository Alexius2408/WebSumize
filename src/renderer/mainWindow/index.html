<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./index.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSumize - Main</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=refresh"
    />
  </head>
  <body>
    <div id="taskbar">
      <h1>WebSumize</h1>
      <div class="dropdownmenu">
        <svg
          id="lines"
          xmlns="http://www.w3.org/2000/svg"
          height="24px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#e3e3e3"
        >
          <path
            d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
          />
        </svg>

        <div class="dropdownmenu-content">
          <button id="Settings" class="dropdownBtn">Settings</button>
          <button id="export" class="dropdownBtn">Export Data</button>
          <button id="import" class="dropdownBtn">Import Data</button>
          <button id="logoutBtn" class="dropdownBtn">Logout</button>
        </div>
      </div>
    </div>
    <span title="Refresh timetable (Ctrl + Shift + R)" class="material-symbols-outlined" id="refreshBtn"> refresh </span>
    <div id="timetable">
      <p id="timetabletext"></p>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
