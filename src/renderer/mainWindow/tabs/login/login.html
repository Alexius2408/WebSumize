<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSumize - Login</title>
    <link rel="stylesheet" href="loginStyle.css" />
    <script type="module" src="../../app.js"></script>
  </head>
  <body>
    <div class="container-wrapper">
      <div id="writer">
        <span id="writer-content"></span><span id="writer-cursor">|</span>
      </div>
      <div class="login-container">
        <div class="logo">
          <img
            src="../../../../assets/LogoWebSumize.png"
            alt="WebSumize Logo"
          />
        </div>
        <div class="form">
          <form>
            <h1>Welcome to WebSumize</h1>
            <br />
            <br />
            <h2>Login to continue</h2>
            <h3 id="offlineText" class="hidden loginFailed">
              You are offline. Connect to the internet to continue.
            </h3>
            <div class="input-box">
              <input
                class="input"
                type="text"
                name=""
                placeholder="john.doe"
                id="username"
              />
              <label>School Username</label>
            </div>
            <div class="input-box">
              <input
                class="input"
                type="password"
                name=""
                placeholder="SchoolPassword123"
                id="password"
                required
              />
              <label>School Password</label>

              <!-- Password is Visible -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 122.88 65.06"
                id="passwordVisible"
                class="passwordvisibility password-icon hidden"

                />
              </svg>

                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 122.879 79.699"
                id="passwordNotVisible"

              >

            </div>
            <div class="input-box">
              <input
                class="input"
                type="text"
                name=""
                placeholder="my-school"
                id="schoolName"
                required
              />
              <label>School Name</label>
            </div>
            <div class="input-box">
              <input
                class="input"
                type="text"
                name=""
                placeholder="myschool.webuntis.com"
                id="schoolUrl"
                required
              />
              <label>School Url</label>
            </div>
            <p id="loginFailedInfo" class="hidden loginFailed">Login Failed</p>
            <p id="loginFailedInfoLink" class="hidden loginFailed">
              Check <a class="loginFailedLink" href="#">here</a> if the issue
              happens more often.
            </p>
            <button id="loginButton" type="button">
              LOGIN<span class="loader hidden" id="loaderAnim"></span>
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="loginScript.js"></script>
  </body>
</html>
