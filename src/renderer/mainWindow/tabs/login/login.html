<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSumize - Login</title>
    <link rel="stylesheet" href="loginStyle.css" />
    <script type="module" src="../../app.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=visibility,visibility_off"
    />
  </head>
  <body>
    <div class="container-wrapper">
      <div id="writer">
        <span id="writer-content"></span><span id="writer-cursor">|</span>
      </div>
      <div class="login-container">
        <div class="logo">
          <img
            src="../../../../assets/LogoWebSumize.ico"
            alt="WebSumize Logo"
          />
        </div>
        <div class="form">
          <form>
            <h1>Welcome to WebSumize</h1>
            <br />
            <br />
            <h2>Login to continue</h2>
            <div class="input-box">
              <input
                class="input"
                type="text"
                name=""
                placeholder="john.doe"
                id="username"
              />
              <label>School Username</label>
            </div>
            <div class="input-box">
              <input
                class="input"
                type="password"
                name=""
                placeholder="SchoolPassword123"
                id="password"
                required
              />
              <label>School Password</label>
              <span id="passwordvisibility" class="material-symbols-outlined">visibility</span>
            </div>
            <div class="input-box">
              <input
                class="input"
                type="text"
                name=""
                placeholder="my-school"
                id="schoolName"
                required
              />
              <label>School Name</label>
            </div>
            <div class="input-box">
              <input
                class="input"
                type="text"
                name=""
                placeholder="myschool.webuntis.com"
                id="schoolUrl"
                required
              />
              <label>School Url</label>
            </div>
            <p id="loginFailedInfo" class="hidden loginFailed">Login Failed</p>
            <p id="loginFailedInfoLink" class="hidden loginFailed">
              Check <a class="loginFailedLink" href="#">here</a> if the issue
              happens more often.
            </p>
            <button id="loginButton" type="button">
              LOGIN<span class="loader hidden" id="loaderAnim"></span>
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="loginScript.js"></script>
  </body>
</html>
