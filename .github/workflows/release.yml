name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write       # create tags/releases, push the version-bump commit
  issues: write         # comment on released issues
  pull-requests: write  # comment on released PRs

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The release job needs no Electron binary, native keytar build or git hooks.
      - run: npm ci --ignore-scripts

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
